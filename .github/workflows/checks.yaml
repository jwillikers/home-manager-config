name: Build and test packages
"on":
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    paths:
      - "overlays/**"
      - .github/workflows/checks.yaml
      - flake.lock
      - flake.nix

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      # Always run this job so that required status checks report on every PR,
      # but only do the work when relevant files changed.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            relevant:
              - "overlays/**"
              - .github/workflows/checks.yaml
              - flake.lock
              - flake.nix
      - name: Determine whether to run
        id: gate
        run: echo "run=${{ github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
      - uses: DeterminateSystems/nix-installer-action@main
        if: steps.gate.outputs.run == 'true'
        with:
          determinate: true
      # Each package runs its tests, linters, and type checkers when it's built.
      - name: Build the flake's checks
        if: steps.gate.outputs.run == 'true'
        run: |
          nix eval --json .#checks.x86_64-linux --apply builtins.attrNames \
            | jq --raw-output '.[] | ".#checks.x86_64-linux.\(.)"' \
            | xargs nix build --no-link --print-build-logs
